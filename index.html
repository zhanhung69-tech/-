<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>GAS 版本測試</title>
<style>
body{font-family:Arial,sans-serif;margin:20px;background:#f1f5f9}
pre{background:#1e293b;color:#e2e8f0;padding:14px;border-radius:8px;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto}
button{background:#2563eb;color:#fff;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:13px;margin:4px}
.ok{color:#4ade80;font-weight:700} .err{color:#f87171;font-weight:700}
h2{font-size:15px;color:#1e3a8a;margin-top:20px}
input{border:1px solid #cbd5e1;border-radius:4px;padding:6px 10px;font-size:13px;width:600px}
</style>
</head>
<body>
<h1 style="color:#1e3a8a">🔧 GAS 版本直接測試</h1>

<div style="background:#fff;border-radius:8px;padding:16px;margin-bottom:16px;border:1px solid #e2e8f0">
  <b>GAS 網址</b><br><br>
  <input id="url" value="https://script.google.com/macros/s/AKfycbw4Wlq3t5SO12e7Cs8bNgZyWgmvag1V6IB4t-RqMtJY9r0YbudMPAdHvqj-tZXrjac/exec">
</div>

<button onclick="test('ping')">1. ping 測試</button>
<button onclick="test('roll_all')">2. roll_all 測試</button>
<button onclick="test('beds')">3. beds 測試</button>
<button onclick="testPost()">4. POST submit_roll 測試</button>

<h2>結果：<span id="st"></span></h2>
<pre id="out">點擊上方按鈕開始</pre>

<h2>說明</h2>
<div style="background:#fff;border-radius:8px;padding:14px;border:1px solid #e2e8f0;font-size:13px;line-height:1.8">
  <b>如果 roll_all 回傳 <span class="err">未知 action: roll_all</span></b><br>
  → GAS 部署的版本沒有更新，即使檔案內容一樣<br><br>
  <b>解決方法：</b><br>
  1. GAS 編輯器 → 部署 → <b>管理部署項目</b><br>
  2. 確認「版本」欄顯示的是<b>最新版本號碼</b>（數字最大的那個）<br>
  3. 如果不確定，改選「<b>HEAD（開發中）</b>」或重新建立部署<br>
  4. 也可以嘗試：部署 → <b>新增部署項目</b>（建一個全新的，不是編輯舊的）
</div>

<script>
const url = () => document.getElementById('url').value.trim();

async function test(action) {
  document.getElementById('st').innerHTML = '⏳';
  document.getElementById('out').textContent = '載入中…';
  try {
    const r = await fetch(url() + '?action=' + action);
    const data = await r.json();
    document.getElementById('st').innerHTML = data.ok 
      ? '<span class="ok">✅ OK</span>' 
      : '<span class="err">❌ ' + (data.error||'錯誤') + '</span>';
    document.getElementById('out').textContent = JSON.stringify(data, null, 2);
  } catch(e) {
    document.getElementById('st').innerHTML = '<span class="err">❌ fetch 失敗</span>';
    document.getElementById('out').textContent = e.message;
  }
}

async function testPost() {
  document.getElementById('st').innerHTML = '⏳';
  try {
    const body = {
      action: 'submit_roll',
      bld: 'F1',
      entries: [],
      by: '測試'
    };
    const r = await fetch(url(), {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    const data = await r.json();
    document.getElementById('st').innerHTML = data.ok 
      ? '<span class="ok">✅ POST OK</span>' 
      : '<span class="err">❌ ' + (data.error||'錯誤') + '</span>';
    document.getElementById('out').textContent = JSON.stringify(data, null, 2);
  } catch(e) {
    document.getElementById('out').textContent = e.message;
  }
}
</script>
</body>
</html>
