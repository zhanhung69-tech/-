<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>API 診斷工具</title>
<style>
body{font-family:Arial,sans-serif;margin:20px;background:#f1f5f9}
h1{color:#1e3a8a;font-size:18px}
.card{background:#fff;border-radius:8px;padding:16px;margin-bottom:14px;border:1px solid #e2e8f0}
button{background:#2563eb;color:#fff;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:13px;margin:4px}
button.g{background:#15803d}
button.r{background:#dc2626}
pre{background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:12px;font-size:12px;overflow:auto;max-height:400px;white-space:pre-wrap;word-break:break-all}
.ok{color:#15803d;font-weight:700}
.err{color:#dc2626;font-weight:700}
label{font-size:13px;font-weight:700;margin-right:6px}
input,select{border:1px solid #cbd5e1;border-radius:4px;padding:4px 8px;font-size:13px;margin:2px}
</style>
</head>
<body>
<h1>🔧 宿舍系統 API 診斷工具</h1>

<div class="card">
  <b>GAS URL：</b><span id="url-display" style="font-size:12px;color:#64748b"></span><br><br>
  <label>URL（可修改）</label>
  <input id="gas-url" style="width:600px" value="https://script.google.com/macros/s/AKfycbw4Wlq3t5SO12e7Cs8bNgZyWgmvag1V6IB4t-RqMtJY9r0YbudMPAdHvqj-tZXrjac/exec">
</div>

<div class="card">
  <b>1. 基本連線測試</b><br><br>
  <button onclick="testAction('ping')">ping</button>
  <button onclick="testAction('students')">students</button>
  <button onclick="testAction('beds')">beds</button>
  <button onclick="testAction('roll_all')">roll_all（全量點名）</button>
  <button onclick="testRollAllToday()" class="g">roll_all（今天）</button>
</div>

<div class="card">
  <b>2. 新增房間測試</b><br><br>
  <label>棟別代碼</label><select id="t-bld"><option value="F1">F1(女12F)</option><option value="F2">F2(女11F)</option><option value="F3">F3(女10F)</option><option value="M1">M1(男9F)</option><option value="M2">M2(男8F)</option><option value="M3">M3(男6F)</option></select>
  <label>房號</label><input id="t-rm" value="1299" style="width:80px">
  <label>床數</label><input id="t-beds" value="2" style="width:50px" type="number">
  <button onclick="testAddRoom()" class="g">➕ 新增房間</button>
  <button onclick="testGetBeds()" >重新讀取 beds</button>
</div>

<div class="card">
  <b>3. 點名資料測試</b><br><br>
  <label>日期</label><input type="date" id="t-date">
  <button onclick="testRollDate()" class="g">查詢該日點名</button>
  <button onclick="testAction('roll_all')">查全部點名</button>
</div>

<div class="card">
  <b>結果</b>
  <span id="status"></span>
  <pre id="result">（點擊上方按鈕開始測試）</pre>
</div>

<script>
const GAS_URL = () => document.getElementById('gas-url').value.trim();

function show(data, label='') {
  const pre = document.getElementById('result');
  const st  = document.getElementById('status');
  const json = JSON.stringify(data, null, 2);
  pre.textContent = (label ? label + '\n' : '') + json;
  if(data && data.ok) st.innerHTML = '<span class="ok">✅ OK</span>';
  else st.innerHTML = '<span class="err">❌ 錯誤：' + (data?.error||'未知') + '</span>';
}

async function gasGet(params) {
  const url = GAS_URL() + '?' + new URLSearchParams(params);
  const r = await fetch(url);
  return r.json();
}

async function gasPost(body) {
  const r = await fetch(GAS_URL(), {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  return r.json();
}

async function testAction(action) {
  document.getElementById('status').textContent = '⏳ 載入中…';
  document.getElementById('result').textContent = '請稍候…';
  try {
    const r = await gasGet({action});
    show(r, '=== action: ' + action + ' ===');
  } catch(e) {
    document.getElementById('result').textContent = '❌ 錯誤：' + e.message;
  }
}

async function testRollAllToday() {
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('status').textContent = '⏳ 載入中…';
  try {
    const r = await gasGet({action:'roll_all'});
    // 篩今天
    const todayStr = today.replace(/-/g,'/');
    const all = r.data||[];
    const todayRows = all.filter(row => String(row.date||'').slice(0,10).replace(/-/g,'/') === todayStr);
    show({ok:r.ok, total_rows: all.length, today_rows: todayRows.length, today: todayStr, today_data: todayRows});
  } catch(e) {
    document.getElementById('result').textContent = '❌ 錯誤：' + e.message;
  }
}

async function testGetBeds() {
  document.getElementById('status').textContent = '⏳ 載入中…';
  try {
    const r = await gasGet({action:'beds'});
    // 顯示每棟房間數
    const summary = {};
    Object.entries(r.data||{}).forEach(([bld, rooms]) => {
      summary[bld] = Object.keys(rooms).length + ' 間房';
    });
    show({ok:r.ok, summary, full_data: r.data});
  } catch(e) {
    document.getElementById('result').textContent = '❌ 錯誤：' + e.message;
  }
}

async function testAddRoom() {
  const bld = document.getElementById('t-bld').value;
  const rm  = document.getElementById('t-rm').value.trim();
  const bedCount = parseInt(document.getElementById('t-beds').value)||2;
  if(!rm) { alert('請輸入房號'); return; }
  document.getElementById('status').textContent = '⏳ 新增中…';
  const BEDS = ['A','B','C','D','E','F'].slice(0, bedCount);
  const results = [];
  for(const bed of BEDS) {
    try {
      const r = await gasPost({action:'save_bed', bld, r:rm, bed, status:'empty', note:'診斷測試', by:'診斷工具'});
      results.push({bed, ...r});
    } catch(e) {
      results.push({bed, ok:false, error: e.message});
    }
  }
  show({bld, rm, bedCount, results}, '=== 新增房間結果 ===');
  // 重新讀取 beds
  setTimeout(testGetBeds, 1000);
}

async function testRollDate() {
  const date = document.getElementById('t-date').value || new Date().toISOString().slice(0,10);
  document.getElementById('status').textContent = '⏳ 載入中…';
  try {
    const r = await gasGet({action:'roll_all'});
    const ds = date.replace(/-/g,'/');
    const all = r.data||[];
    const filtered = all.filter(row => String(row.date||'').slice(0,10).replace(/-/g,'/') === ds);
    // 統計
    const byBld = {};
    filtered.forEach(row => {
      const b = row.bld||'?';
      if(!byBld[b]) byBld[b] = {in:0,lv:0,ab:0};
      byBld[b][row.status] = (byBld[b][row.status]||0)+1;
    });
    show({ok:r.ok, date, total_all:all.length, filtered_count:filtered.length, by_bld:byBld, sample_rows: filtered.slice(0,5)});
  } catch(e) {
    document.getElementById('result').textContent = '❌ 錯誤：' + e.message;
  }
}

// 預設今天
document.getElementById('t-date').value = new Date().toISOString().slice(0,10);
</script>
</body>
</html>
